<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>BauBuddy Site</title>
<meta name="theme-color" content="#0e1118">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BauBuddy">
<link rel="manifest" href="m.webmanifest">
<link rel="apple-touch-icon" href="img/app-180.png">
<link rel="icon" type="image/svg+xml" href="img/logo.svg">
<style>
:root{--bg:#0e1118;--card:#171b25;--card2:#1e2330;--line:rgba(255,255,255,.09);--ink:#f2f4f8;--mut:#9aa3b3;--acc:#ff7a00;--ok:#3ddc84;--blue:#2f80ed;--bad:#ff5a6e;
  --safe-t:env(safe-area-inset-top);--safe-b:env(safe-area-inset-bottom)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;min-height:100dvh;padding:calc(var(--safe-t) + 10px) 16px calc(var(--safe-b) + 14px)}
header{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--acc);display:grid;place-items:center;font-weight:800;color:#1b1b1b;font-size:14px}
header b{font-size:17px} header b span{color:var(--acc)}
header small{display:block;color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62vw}
.lang{margin-left:auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 11px;font-weight:700;font-size:13px}
.loc{margin-top:12px;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.loc .d{width:12px;height:12px;border-radius:50%;background:var(--mut);flex:none}
.loc.on .d{background:var(--blue);animation:pulse 1.5s infinite}
.loc.sim .d{background:#8b5cf6}
.loc div{flex:1;min-width:0} .loc b{display:block;font-size:14px} .loc small{color:var(--mut);font-size:12px}
.loc button{border:1px solid var(--line);background:var(--card2);color:var(--ink);border-radius:10px;padding:7px 10px;font-size:12.5px;font-weight:600}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,128,237,.7)}100%{box-shadow:0 0 0 12px rgba(47,128,237,0)}}
.feed{flex:1;overflow:auto;margin:14px 0 10px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.empty{margin:auto;text-align:center;color:var(--mut);font-size:14px;padding:20px}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
.msg{padding:10px 13px;border-radius:16px;max-width:88%;font-size:14.5px;animation:in .3s ease}
.msg.me{align-self:flex-end;background:#3a2412;border:1px solid rgba(255,122,0,.35)}
.msg.ai{align-self:flex-start;background:var(--card);border:1px solid var(--line)}
.msg.ok{border-color:rgba(61,220,132,.5)} .msg.warn{border-color:rgba(255,90,110,.55)}
.msg img{display:block;width:100%;border-radius:10px;margin-bottom:6px}
.msg small{display:block;color:var(--mut);font-size:11.5px;margin-top:4px}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.compose{display:flex;gap:8px;margin-bottom:12px}
.compose input{flex:1;min-width:0;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:12px 14px;font-size:16px}
.compose button,.side{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;font-weight:700}
.compose button{padding:0 16px;background:var(--acc);color:#1b1b1b;border-color:transparent}
.bar{display:flex;align-items:center;justify-content:space-between;gap:14px}
.side{width:64px;height:64px;display:grid;place-items:center;font-size:24px;position:relative}
.side span{position:absolute;bottom:-18px;font-size:11px;color:var(--mut);font-weight:600}
.mic{width:104px;height:104px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#ffb066,#ff7a00 55%,#d35b00);
  box-shadow:0 12px 30px rgba(255,122,0,.4),inset 0 2px 0 rgba(255,255,255,.35);display:grid;place-items:center;position:relative;touch-action:none;
  transition:transform .15s cubic-bezier(.3,1.6,.5,1)}
.mic svg{width:40px;height:40px;color:#1b1b1b}
.mic.rec{transform:scale(1.1);background:radial-gradient(circle at 35% 30%,#ff8a95,#ff4d5e 55%,#c62f3e)}
.mic.rec::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:3px solid rgba(255,90,110,.6);animation:ring 1.1s infinite}
.mic.busy{opacity:.6}
@keyframes ring{from{transform:scale(.9);opacity:1}to{transform:scale(1.35);opacity:0}}
.hint{text-align:center;color:var(--mut);font-size:12.5px;margin-top:24px;min-height:18px}
.toast{position:fixed;left:50%;top:calc(var(--safe-t) + 12px);transform:translate(-50%,-140%);background:var(--card2);border:1px solid rgba(61,220,132,.5);
  padding:10px 16px;border-radius:999px;font-weight:650;font-size:14px;transition:transform .4s cubic-bezier(.2,1.4,.4,1);z-index:9;white-space:nowrap}
.toast.on{transform:translate(-50%,0)}
.toast.bad{border-color:rgba(255,90,110,.6)}
input[type=file]{display:none}
</style></head><body>
<header><div class="logo">BB</div><div><b>Bau<span>Buddy</span></b><small id="site">Site</small></div><button class="lang" id="lang">EN</button></header>

<div class="loc" id="loc"><span class="d"></span><div><b id="locT">Location off</b><small id="locS">Tap to show where you are on the site</small></div>
  <button id="locBtn">Share</button></div>

<div class="feed" id="feed"><div class="empty"><b>Hold the button and talk</b>“Excavator idle since 10, hydraulic failure at Achse 1”<br>or take a photo of the site.</div></div>

<div class="compose"><input id="txt" placeholder="Type a note…" enterkeyhint="send" autocomplete="off"><button id="send">➤</button></div>
<div class="bar">
  <label class="side" for="cam">📷<span id="camL">Photo</span></label>
  <input type="file" id="cam" accept="image/*" capture="environment">
  <button class="mic" id="mic" aria-label="Hold to talk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
  <button class="side" id="sim" aria-label="Simulate on site">🏗️<span id="simL">On site</span></button>
</div>
<div class="hint" id="hint">Hold to talk · release to send</div>
<div class="toast" id="toast"></div>
<script src="js/sfx.js"></script>
<script src="js/mobile.js"></script>
</body></html>
